[project]
name = "maldi-tof-classifier"
version = "0.1.0"
description = "The maldi_tof_classifier package offers a CLI and Python 3 API for machine learning based classification of MALDI TOF spectra as measured by a Shimadzu 8300 MALDI-TOF mass spectrometer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "imbalanced-learn>=0.0",
    "joblib>=1.5.3",
    "keras>=3.12.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pyopls>=20.3.post1",
    "pyyaml>=6.0.3",
    "rpy2>=3.6.7",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.67.1",
    "typer>=0.24.1",
    "xgboost>=3.1.3",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "build>=1.4.2",
    "ipynb>=0.5.1",
    "jupyter>=1.1.1",
    "notebook>=7.5.1",
    "pytest>=9.0.2",
    "setuptools>=82.0.1",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mtc = "maldi_tof_classifier.cli.cli:main"
